CONFIG_PM=n
CONFIG_PM_DEVICE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_ASSERT=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=256
CONFIG_ISR_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_USBD_THREAD_STACK_SIZE=2048
# Catch stack overflows as a fault instead of silent corruption
CONFIG_HW_STACK_PROTECTION=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
CONFIG_I2C=y
CONFIG_I2S=y
# Deep TX queue so bursty eMMC refills don't underrun (matches NUM_BLOCKS)
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=16
# TAS2505 reset is on P0.09 (NFC1) — reclaimed as GPIO via &uicr in sp1.dts

# USB CDC ACM for stem upload protocol
CONFIG_RING_BUFFER=y
CONFIG_RING_BUFFER_LARGE=y
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
# More UDC buffers → more bulk-OUT transfers in flight → higher upload throughput
CONFIG_UDC_BUF_COUNT=32
CONFIG_UDC_BUF_POOL_SIZE=24576
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="SP-1 Stem Player"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="marisko"
CONFIG_CDC_ACM_SERIAL_VID=0x2FE3
CONFIG_CDC_ACM_SERIAL_PID=0x0101
CONFIG_CDC_ACM_SERIAL_MAX_POWER=100
